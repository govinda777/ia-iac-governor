name: AI-Native Governance PoC

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  governance-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Setup OPA
        run: |
          curl -L -o opa https://openpolicyagent.org/downloads/v0.61.0/opa_linux_amd64_static
          chmod 755 ./opa
          sudo mv ./opa /usr/local/bin/

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Run OPA Policy Check (Standalone)
        run: |
          # Example of how OPA would be called directly on a plan
          # For the PoC, we demonstrate the agentic flow below
          opa check policies/compliance.rego

      - name: Run AI Governance Simulation
        run: |
          python3 simulate_poc.py

      - name: Upload Audit Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: governance-report
          path: |
            schema/security_graph.json
            policies/compliance.rego
